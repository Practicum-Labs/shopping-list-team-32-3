name: PR checks

on:
    push:
        branches: [ "main", "develop" ]
    pull_request:
        branches: [ "main", "develop" ]

# Отменяем устаревшие запуски на той же ветке/PR, чтобы не гонять лишнее
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Минимально необходимые права токену
permissions:
    contents: read

env:
    commonGradleFlags: --parallel --stacktrace --no-configuration-cache --no-daemon

jobs:
    checks:
        name: Detekt + Unit tests
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Validate Gradle wrapper
                uses: gradle/actions/wrapper-validation@v4

            -   name: Setup JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Run detekt
                run: ./gradlew detekt $commonGradleFlags

            -   name: Run unit tests
                run: ./gradlew testDebugUnitTest $commonGradleFlags

            -   name: Upload reports (on failure)
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: reports
                    path: |
                        build/reports/detekt/
                        app/build/reports/
                    retention-days: 7

    assemble:
        name: Assemble debug APK
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Assemble debug
                run: ./gradlew :app:assembleDebug $commonGradleFlags

            -   name: Archive APK
                uses: actions/upload-artifact@v4
                with:
                    name: app-debug.apk
                    path: app/build/outputs/apk/debug/app-debug.apk
                    retention-days: 7
