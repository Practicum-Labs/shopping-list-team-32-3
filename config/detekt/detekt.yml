# Конфигурация detekt (NFR-02).
#
# В build.gradle.kts включён `buildUponDefaultConfig = true` — активен весь дефолтный
# ruleset detekt, ниже только наши переопределения. Набор правил адаптирован из
# эталонного проекта Практикума (Vacancies), пороги сложности — под NFR-02.
# Полный список правил с дефолтами:  ./gradlew detektGenerateConfig

build:
  maxIssues: 0          # сборка/CI падает при любом нарушении

comments:
  active: false         # KDoc на публичные сущности не требуем

complexity:
  active: true
  CognitiveComplexMethod:
    active: true
    threshold: 15
  ComplexCondition:
    active: true
    threshold: 4
  CyclomaticComplexMethod:
    active: true
    threshold: 10
  LongMethod:
    active: true
    threshold: 50               # тело функции < 50 строк (NFR-02)
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 6        # аргументов функции < 6 (NFR-02)
    constructorThreshold: 7
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated: ['Composable']
  LargeClass:
    active: true
    threshold: 350              # тело класса < 350 строк (NFR-02)
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreAnnotatedFunctions: ['Composable']

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true                # запрет GlobalScope — только viewModelScope и т.п.
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected|ignored).*'
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

exceptions:
  active: true
  PrintStackTrace:
    active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes: ['InterruptedException', 'NumberFormatException', 'ParseException']
    allowedExceptionNameRegex: '_|(ignore|expected|ignored).*'
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected|ignored).*'
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
    exceptions: ['IllegalArgumentException', 'IllegalStateException', 'IOException']

formatting:
  active: true
  android: false
  autoCorrect: true
  FinalNewline:
    active: true
  ImportOrdering:
    active: true
    layout: '*,java.**,javax.**,kotlin.**,^'
  Indentation:
    active: true
    indentSize: 4
  ModifierOrdering:
    active: true
  NoConsecutiveBlankLines:
    active: true
  NoEmptyClassBody:
    active: true
  NoMultipleSpaces:
    active: true
  NoSemicolons:
    active: true
  NoTrailingSpaces:
    active: true
  NoUnusedImports:
    active: true
  SpacingAroundColon:
    active: true
  SpacingAroundComma:
    active: true
  SpacingAroundCurly:
    active: true
  SpacingAroundKeyword:
    active: true
  SpacingAroundOperators:
    active: true

naming:
  active: true
  FunctionNaming:
    # Composable и Preview именуются с заглавной буквы.
    ignoreAnnotated: ['Composable', 'Preview']
  NoNameShadowing:
    active: true
  NonBooleanPropertyPrefixedWithIs:
    active: true
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

performance:
  active: true
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  CastToNullableType:
    active: true
  ImplicitDefaultLocale:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
  NullableToStringCall:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true

style:
  active: true
  ForbiddenComment:
    # TODO/FIXME допустимы на этапе разработки скелета.
    active: false
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'kotlin.io.println'
      - value: 'kotlin.io.print'
  MagicNumber:
    # В Compose много «магии» (dp, alpha, веса) — иначе шум.
    active: false
  MayBeConst:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  ReturnCount:
    active: true
    max: 3
    excludeGuardClauses: true
  RedundantVisibilityModifierRule:
    active: true
  ThrowsCount:
    active: true
    max: 2
  UnnecessaryApply:
    active: true
  UnnecessaryFilter:
    active: true
  UnnecessaryLet:
    active: true
  UnusedImports:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  UseIfEmptyOrIfBlank:
    active: true
  UseIsNullOrEmpty:
    active: true
  UseOrEmpty:
    active: true
  VarCouldBeVal:
    active: true
  WildcardImport:
    active: true
    excludeImports: ['java.util.*']
